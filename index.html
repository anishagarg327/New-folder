<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>new-folder</title>
  </head>
  <body>
    <div id="error-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); color:red; z-index:999999; padding:2rem; font-family:monospace; overflow:auto;">
      <h1>Global Error Caught!</h1>
      <pre id="error-msg" style="white-space:pre-wrap; font-size:16px;"></pre>
      <button onclick="window.location.reload()" style="padding:10px; margin-top:20px;">Reload</button>
    </div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-msg').textContent = msg + '\n\n' + (error && error.stack ? error.stack : '');
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-msg').textContent = 'Unhandled Promise: ' + event.reason + '\n\n' + (event.reason && event.reason.stack ? event.reason.stack : '');
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
